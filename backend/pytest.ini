[tool:pytest]
testpaths = tests
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --ignore=tests/test_stress_locust.py
    --cov=.
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=35
    --cov-config=.coveragerc

[coverage:run]
omit =
    .venv/*
    tests/*
    **/migrations/*
    **/__pycache__/*
    **/conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
