[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]
ignore = [
    "E501", # line too long
    "F403", # star imports
    "F405", # may be undefined, or defined from star imports
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
